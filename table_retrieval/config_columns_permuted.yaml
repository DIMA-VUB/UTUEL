# Table retrieval evaluation on column-permuted WikiSQL tables.
retrieval:
  k_values: [1, 3, 5, 10, 20]
  top_k_export: 5
  tsr_top_k: 2000
  tsr_mrr_depth: 1000
  save_embeddings: true               # true = save table/query vectors to output_dir/embeddings/*.npz

output_dir: table_retrieval/results
checkpoints_dir: D:\UTUEL_OUTPUT\collect_results_revision\checkpoints
cache_dir: D:\UTUEL_OUTPUT\cache_embeddings

datasets:
  - &_dataset
    name: test_lookup_WikiSQL_columns
    path: datasets/test_lookup_WikiSQL_columns.jsonl
    embedder:
      type: huggingface
      model_name: sentence-transformers/all-MiniLM-L6-v2
      batch_size: 64
  - <<: *_dataset
    embedder:
      type: huggingface
      model_name: sentence-transformers/all-mpnet-base-v2
      batch_size: 64
  - <<: *_dataset
    embedder:
      type: ollama
      base_url: http://${oc.env:OLLAMA_IP,localhost}:11434
      model_name: nomic-embed-text
      batch_size: 1
  - <<: *_dataset
    embedder:
      type: ollama
      base_url: http://${oc.env:OLLAMA_IP,localhost}:11434
      model_name: all-minilm
      batch_size: 1
  - <<: *_dataset
    embedder:
      type: ollama
      base_url: http://${oc.env:OLLAMA_IP,localhost}:11434
      model_name: qwen3-embedding:0.6b
      batch_size: 1
  - <<: *_dataset
    embedder:
      type: ollama
      base_url: http://${oc.env:OLLAMA_IP,localhost}:11434
      model_name: embeddinggemma
      batch_size: 1
  - <<: *_dataset
    embedder:
      type: ollama
      base_url: http://${oc.env:OLLAMA_IP,localhost}:11434
      model_name: granite-embedding
      batch_size: 1
